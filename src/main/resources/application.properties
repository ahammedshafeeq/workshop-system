# Workshop Registration & Certificate Issue System
# KTU B.Tech S3 Computer Science and Engineering Java Mini Project
# Group TRIX

spring.application.name=workshop-system
# Server Port (Dynamically uses Render's $PORT, defaults to 8080 locally)
server.port=${PORT:8080}

# Database Configuration (Managed dynamically by DatabaseConfig.java)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workshop_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Automatic Database Initialization is handled dynamically by DatabaseAutoMigrator.java
spring.sql.init.mode=never

# Static file serving & session handling
spring.web.resources.static-locations=classpath:/static/
server.servlet.session.timeout=2h
server.servlet.session.cookie.name=TRIX_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Certificate storage path
app.certificate.storage-dir=./certificates
app.institution.name=APJ Abdul Kalam Technological University
app.department.name=Department of Computer Science and Engineering
app.signatory.hod=Dr. Anand Varma, Ph.D.
app.signatory.coordinator=Prof. Lakshmi Priya, M.Tech

# Logging configuration
logging.level.com.trix.workshop=INFO
logging.level.org.springframework.jdbc=WARN
