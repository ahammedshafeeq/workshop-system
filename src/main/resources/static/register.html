<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Student Profile | TRIX Workshops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=4.0">
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 50%, #F0FDFA 100%);
      background-image: 
        radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.08) 0px, transparent 50%);
    }

    .auth-card {
      width: 100%;
      max-width: 520px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 30px -5px rgba(13, 148, 136, 0.12);
      padding: 42px 36px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-dark));
      color: #FFFFFF;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.28);
    }

    .auth-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="auth-page-wrap">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" style="text-decoration: none;">
          <div class="auth-brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="12" y1="6" x2="16" y2="6"></line>
              <line x1="12" y1="10" x2="16" y2="10"></line>
            </svg>
          </div>
        </a>
        <h2 class="auth-title">Participant Registration</h2>
        <p class="auth-subtitle">Join the KTU academic workshop series and earn verified certificates</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-fullname">Full Name *</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Alex Johnson" required>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="e.g. alex@gmail.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password *</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98471 23456">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-dept">Department</label>
            <input type="text" id="reg-dept" class="form-control" placeholder="e.g. Computer Science & Engg">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-institution">Institution / College Name</label>
          <input type="text" id="reg-institution" class="form-control" placeholder="e.g. College of Engineering Trivandrum">
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          <span>Complete Registration</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--brand-primary); font-weight: 700; text-decoration: none;">Sign in here</a>
      </div>
    </div>

    <div style="margin-top: 24px; text-align: center; font-size: 0.84rem;">
      <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-weight: 600;">&larr; Return to Home Page</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('register-form');
    const submitBtn = document.getElementById('reg-submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: document.getElementById('reg-fullname').value.trim(),
        email: document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
        phone: document.getElementById('reg-phone').value.trim(),
        department: document.getElementById('reg-dept').value.trim(),
        institution: document.getElementById('reg-institution').value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Creating profile...</span>';

      try {
        await Auth.register(payload);
      } catch (err) {
        showToast(err.message || 'Registration failed.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Complete Registration</span>';
      }
    });
  </script>
</body>
</html>
